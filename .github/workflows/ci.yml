name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Let cargo use the git CLI so the token below applies to the private SDK repo.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grant cargo access to satoraHQ/swap
        # SDK_DEPLOY_KEY: private half of a read-only deploy key on satoraHQ/swap.
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SDK_DEPLOY_KEY }}
      - name: Fetch GitHub over SSH
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test
        run: ./target/release/satora-ln2base --help
